name: reproducibility-checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Integrity checks compare committed bytes, so they do not need either
      # pinned scientific environment (see docs/ENVIRONMENT.md).
      - run: python -m pip install pandas==3.0.3 pypdf==6.10.2
      - run: python scripts/verify_frozen_results.py
      - run: python scripts/build_paper_objects.py --check-only
      - run: python -m unittest discover -s tests -v
