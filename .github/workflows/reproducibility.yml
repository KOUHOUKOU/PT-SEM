name: reproducibility-checks

on:
  push:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-simulation.txt
      - run: python -m pip install -r requirements-simulation.txt
      - run: python -m unittest tests.test_reproducibility -v
