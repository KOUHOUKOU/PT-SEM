name: reproducibility-checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # The two scientific profiles are not installed here; name the
          # verification requirements explicitly so the cache key resolves.
          cache-dependency-path: requirements-verify.txt
      - run: python -m pip install -r requirements-verify.txt
      - run: python scripts/verify_frozen_results.py
      - run: python scripts/build_paper_objects.py --check-only
      - run: python -m unittest discover -s tests -v
